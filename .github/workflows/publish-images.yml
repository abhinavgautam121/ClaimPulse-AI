name: Publish release images
on:
  workflow_dispatch:
    inputs:
      backend_origin:
        description: Backend origin compiled into the frontend proxy
        required: true
        default: http://backend:8000
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image_name="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}-${SERVICE}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            API_INTERNAL_URL=${{ inputs.backend_origin }}
